<!doctype html>
<html lang="uk">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelpDesk - Мої звернення</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 80px;
      padding-bottom: 70px;
    }

    .central-container {
      width: 80%;
      margin: 0 auto;
      background: #A1C6F6;
      border-radius: 10px;
      padding: 20px;
      flex-grow: 1;
    }

    .card-body {
      width: 100%;
      background: #f8f9fa;
      color: #022E5B;
      margin-bottom: 15px;
      border-radius: 10px;
      padding: 15px;
    }

    .p-1 {
      background: #b2d1f9;
      color: #022E5B;
      text-decoration: none;
      transition: 0.3s;
    }

    .p-1:hover {
      background: #8fb9f1;
      color: #011a35;
    }

  </style>
</head>

<body>


  <nav class="navbar bg-white border-bottom fixed-top shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary" href="{{ url_for('index') }}">HelpDesk</a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z" />
        </svg>
      </button>

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header border-bottom">
          <h5 class="offcanvas-title">Меню Адміна</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <div class="d-grid gap-2">
            <a href="{{ url_for('my_tickets') }}" class="btn btn-primary">Заявки</a>
            <a href="{{ url_for('create_ticket') }}" class="btn btn-outline-primary">Редактор заявки</a>
            <hr>
            <a href="{{ url_for('logout') }}" class="btn btn-secondary">Вийти</a>
          </div>
        </div>
      </div>
    </div>
</div>
  </nav>

  <main class="central-container shadow-sm">
  <div class="card shadow-sm">
        <div class="card-body p-4">
          <h5 class="card-title">Тема</h5>
          <div class="position-absolute top-0 end-0 mt-2 me-3">
            <span class="badge text-bg-primary p-2">
              Кімната: {{ current_user.room_number }}
            </span>
          </div>

          <form action="{{ url_for('create_ticket') }}" method="POST">
            <div class="mb-3">
              <label class="form-label">Категорія звернення:</label>
              <br>
                  <textarea readonly></textarea>
            </div>
            <div class="mb-4">
              <label for="description" class="form-label">Опис проблеми</label>
              <textarea readonly class="form-control" name="description" id="description" rows="5"></textarea>
            </div>
 <div class="mb-4">
              <label for="description" class="form-label">Коментар до звернення</label>
              <textarea class="form-control" name="description" id="description" rows="5" placeholder="Напишіть коментар до звернення за необхідності"></textarea>
            </div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-custom-main px-5 py-2 shadow-sm">Зберегти</button>
              <button type="submit" class="btn btn-custom-main px-5 py-2 shadow-sm">Видалити заявку</button>
                          <div class="dropdown">
  <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    Зміна статусу
  </button>
  <ul class="dropdown-menu">
    <li><span style="color: #ffc107; font-size: 50px;">●</span>- Нова</li>
    <li><span style="color: #0d6efd; font-size: 50px;">●</span>- В роботі</li>
    <li><span style="color: lime; font-size: 50px;" >●</span> - Відхилено/Виконано </li>
  </ul>
</div>
            </div>
          </form>

        </div>
      </div>
  </main>

  <footer class="navbar fixed-bottom bg-white border-top shadow-sm">
    <div class="container-fluid justify-content-center">
      <span class="text-muted small">HelpDesk &copy; 2026 | Всі права захищено</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
